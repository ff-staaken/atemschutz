<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
/* Layout: App-Shell im Stil der Kantine – dunkelblaue Kopfzeile mit Wappen und Warnstreifen, Inhalt, untere Navigation (Daumenzone) */
:root{
  --bg:#eceef1; --surface:#ffffff; --surface-2:#f5f6f8; --line:#d6dbe1;
  --fg:#15191e; --fg-2:#5b6570; --accent:#d2161e; --accent-fg:#ffffff; --accent-soft:#fbe7e8;
  --navy:#1b2756; --navy-2:#24336b; --navy-ink:#ffffff; --navy-muted:#c3cbe6; --flame:#f7b21b;
  --ok:#1d7a4b; --ok-soft:#e3f3ea; --warn:#8f5400; --warn-soft:#fdf0d9;
  --crit:#b0151b; --crit-soft:#fbe7e8; --info:#1f4f8a; --info-soft:#e4ecf7;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111417; --surface:#1a1e23; --surface-2:#22272d; --line:#2e353d;
  --fg:#edf0f3; --fg-2:#9aa4af; --accent:#e6363d; --accent-fg:#ffffff; --accent-soft:#3a1c1e;
  --navy:#111836; --navy-2:#1a2449; --navy-ink:#ffffff; --navy-muted:#a9b3d6; --flame:#f7b21b;
  --ok:#4fc58a; --ok-soft:#173326; --warn:#f0b04a; --warn-soft:#3a2b12;
  --crit:#ff6b70; --crit-soft:#3a1c1e; --info:#8fb6ec; --info-soft:#1b2a3f; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#1a1e23; --surface-2:#22272d; --line:#2e353d;
  --fg:#edf0f3; --fg-2:#9aa4af; --accent:#e6363d; --accent-fg:#ffffff; --accent-soft:#3a1c1e;
  --navy:#111836; --navy-2:#1a2449; --navy-ink:#ffffff; --navy-muted:#a9b3d6; --flame:#f7b21b;
  --ok:#4fc58a; --ok-soft:#173326; --warn:#f0b04a; --warn-soft:#3a2b12;
  --crit:#ff6b70; --crit-soft:#3a1c1e; --info:#8fb6ec; --info-soft:#1b2a3f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-ink)}
.hrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));max-width:760px;margin:0 auto}
.hrow .logo{height:48px;width:auto;display:block;justify-self:start}
.hpa{margin:0;line-height:0}
.pa{display:block;width:clamp(150px,46vw,250px);height:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:0;justify-self:end;max-width:100%}
.whob{background:var(--navy-2);color:var(--navy-ink);border:1px solid var(--navy-muted);border-radius:999px;padding:4px 11px;font-weight:600;font-size:.8rem;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncb{background:transparent;color:var(--navy-muted);border:0;padding:0;font-size:.75rem;font-weight:600;display:inline-flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.syncb i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.syncb.ok i{background:#4fc58a}.syncb.pend i{background:var(--flame)}.syncb.err i{background:#ff6b70}.syncb.err{color:#ffb4b6}
.syncb.run i{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.3}}
main{flex:1;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(88px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--navy);border-top:3px solid var(--flame);
  display:grid;grid-template-columns:repeat(5,1fr);padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
nav.tabs button{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 .8rem var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--navy-muted);border-radius:8px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--navy-ink)}
nav.tabs button.on svg{color:var(--flame)}
h2{font:700 1.05rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--fg-2);margin:0 0 8px}
h3{font:700 1.45rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
section{display:flex;flex-direction:column}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hint{color:var(--fg-2);font-size:13px;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.item:first-child{border-top:0}
div.item{cursor:default}
.item .main{flex:1;min-width:0}
.item .t1{font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.item .t2{font-size:13px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.typ{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--fg-2);font-family:var(--mono);min-width:34px;text-align:center}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.ok-p{background:var(--ok-soft);color:var(--ok)} .warn-p{background:var(--warn-soft);color:var(--warn)}
.info-p{background:var(--info-soft);color:var(--info)} .crit-p{background:var(--crit-soft);color:var(--crit)}
.muted-p{background:var(--surface-2);color:var(--fg-2)}
.d-warn{color:var(--warn);font-weight:700} .d-crit{color:var(--crit);font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;min-height:44px;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.btn.link{border:0;background:none;padding:6px 0;min-height:0;color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,.item:focus-visible,.sb:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible,.fz:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--fg-2);font-weight:600;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;color:var(--fg);font-weight:400}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:8px;align-items:end}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:38px}
.chip .t{font-size:10px;font-weight:700;color:var(--fg-2);font-family:var(--font)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.on .t{color:var(--accent-fg);opacity:.85}
.chip.miss{border-style:dashed;color:var(--crit)}
span.chip{cursor:default}
.group-l{font-size:12px;color:var(--fg-2);font-weight:650;margin:6px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.banner{border-radius:var(--r);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner .grow{min-width:180px}
.fzgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-left-width:4px}
.fz.ok{border-left-color:var(--ok)} .fz.crit{border-left-color:var(--crit)} .fz.warn{border-left-color:var(--warn)} .fz.info{border-left-color:var(--info)} .fz.muted{border-left-color:var(--line)}
.fz b{font:700 1.45rem/1 var(--display);text-transform:uppercase} .fz .bnr{font:700 1.05rem var(--display);color:var(--fg-2)}
.fz .ruf{font-size:12px;color:var(--fg-2);margin-top:-4px}
.hello .eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-2)}
.hello h3{font-size:1.9rem}
.biglogo{height:110px;width:auto;display:block;margin:0 auto}
.fz .s{font-size:12px;font-weight:600}
.fz .s.ok{color:var(--ok)} .fz .s.crit{color:var(--crit)} .fz .s.warn{color:var(--warn)} .fz .s.info{color:var(--info)} .fz .s.muted{color:var(--fg-2)}
.fz .n{font-size:12px;color:var(--fg-2)}
.step{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .grow{font-size:14px}
.sb{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:600;cursor:pointer;line-height:1}
.sb:disabled{opacity:.35;cursor:default}
.sv{min-width:26px;text-align:center;font-size:16px}
.sv.on{color:var(--accent)}
.mline{display:flex;flex-wrap:wrap;gap:6px}
.mtag{font-family:var(--mono);font-size:13px;padding:3px 8px;border-radius:6px;background:var(--surface-2)}
.mtag.d-warn{background:var(--warn-soft)} .mtag.d-crit{background:var(--crit-soft)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;align-items:start;padding:10px 14px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv>span:first-child{font-size:13px;color:var(--fg-2);font-weight:600;padding-top:3px}
.sig{border:1px dashed var(--line);border-radius:10px;background:var(--surface);touch-action:none;width:100%;height:140px;display:block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h3{flex:1}
.x{background:var(--surface-2);border:0;border-radius:999px;width:36px;height:36px;font-size:20px;cursor:pointer;color:var(--fg)}
.hist{font-size:13px;display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.hist li{display:flex;gap:10px}
.hist .d{color:var(--fg-2);font-family:var(--mono);white-space:nowrap;font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-weight:600;font-size:14px;max-width:90vw}
.empty{padding:20px;text-align:center;color:var(--fg-2);font-size:14px}
.sum{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.err{color:var(--crit);font-size:13px;margin:0}
main a{color:var(--accent)}
#print{display:none}
@media print{
  .app,.overlay,.toast,nav.tabs{display:none!important}
  #print{display:block;color:#000;background:#fff;font:10pt/1.35 Arial,Helvetica,sans-serif}
  body{background:#fff}
  @page{size:A4 landscape;margin:12mm}
}
#print h1{font-size:15pt;margin:0 0 2mm}
#print .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1b2756;padding-bottom:2mm;margin-bottom:4mm}
#print .ph::after{content:none}
#print table{width:100%;border-collapse:collapse;margin:2mm 0 4mm;font-size:9.5pt}
#print th,#print td{border:1px solid #555;padding:1.2mm 1.6mm;text-align:center;vertical-align:middle}
#print th{background:#e7e6e6}
#print td.b{font-weight:bold}
#print td.w{background:#ffeb9c} #print td.c{background:#ffc7ce;color:#9c0006;font-weight:bold}
#print table.kvt td{text-align:left}
#print table.kvt td:first-child{width:35%;font-weight:bold;background:#f2f2f2}
#print table.lt td,#print table.lt th{text-align:left}
#print h2{font-size:11.5pt;text-transform:none;letter-spacing:0;color:#000;margin:3mm 0 1mm}
#print .sigbox{display:flex;gap:10mm;margin-top:8mm}
#print .sigbox div{flex:1 1 0;border-top:1px solid #000;padding-top:1mm;font-size:9pt}
#print .sigbox img{max-height:22mm;display:block}
#print .foot{margin-top:6mm;font-size:8pt;color:#555}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

<script>
'use strict';
/* ================= Grundlagen ================= */
const KEY='atemschutz-logbuch-v1', DRAFT='atemschutz-logbuch-draft3';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const z=n=>String(n).padStart(2,'0');
const isoDate=(d=new Date())=>`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const isoDT=(d=new Date())=>`${isoDate(d)}T${z(d.getHours())}:${z(d.getMinutes())}`;
const fmtD=s=>{if(!s)return'–';const[y,m,d]=s.slice(0,10).split('-');return`${d}.${m}.${y}`};
const fmtDT=s=>!s?'–':fmtD(s)+(s.length>10?' '+s.slice(11,16):'');
const daysUntil=s=>Math.round((new Date(s+'T00:00:00')-new Date(isoDate()+'T00:00:00'))/864e5);
// Fälligkeiten im Format der Liste: MM/JJ, gültig bis Monatsende
const fmtM=f=>f?`${f.slice(5,7)}/${f.slice(2,4)}`:'o. D.';
function parseM(s){s=String(s||'').trim();if(!s)return'';const m=s.match(/^(\d{1,2})\s*[\/.\-]?\s*(\d{2}|\d{4})$/);if(!m)return null;
  const mo=+m[1];if(mo<1||mo>12)return null;const y=m[2].length===2?'20'+m[2]:m[2];return`${y}-${z(mo)}`}
function monthEnd(f){const[y,m]=f.split('-').map(Number);return isoDate(new Date(y,m,0))}
function relZeit(dt){const m=Math.round((Date.now()-new Date(dt))/6e4);if(m<1)return'gerade eben';if(m<60)return`vor ${m} Min.`;const h=Math.round(m/60);if(h<24)return`vor ${h} Std.`;const d=Math.round(h/24);return d===1?'gestern':d<14?`vor ${d} Tagen`:fmtD(dt)}
const tageBis=f=>f?daysUntil(monthEnd(f)):null;
function dueCls(f){if(!f)return'';const n=tageBis(f);return n<0?'d-crit':n<=S.vorlauf?'d-warn':''}
function duePill(f,prefix=''){if(!f)return'';const n=tageBis(f);if(n<0)return`<span class="pill crit-p">${prefix}abgelaufen</span>`;if(n<=S.vorlauf)return`<span class="pill warn-p">${prefix}noch ${n} T</span>`;return''}

const KAT={PA:'Pressluftatmer',CO:'CO-Warner',MGM:'Mehrgasmessgeräte',SON:'Sonstiges',FH:'Fluchthauben',MM:'Masken M',MS:'Masken S',FI:'Filter'};

/* ================= Datenmodell & Speicher ================= */
function baseOrte(){return[{id:POOL,name:'Pool',bnr:'',art:'lager',status:'',pos:1e12,u:0},{id:WS,name:'Atemschutzwerkstatt',bnr:'',art:'lager',status:'',pos:1e12+1,u:0}]}
function emptyState(){return{version:3,sharedU:0,feuerwehr:'',vorlauf:30,orte:baseOrte(),geraete:[],buchungen:[],vorgaenge:[],inventuren:[],users:[],geloescht:{},
  settings:{bearbeiter:'',lastBackup:null,beispiel:false},pending:false,lastSync:null}}
function ensureOrte(s){for(const o of baseOrte())if(!s.orte.some(x=>x.id===o.id))s.orte.push(o)}
// Übernahme älterer Datenstände (Version 1/2 der App)
function migrate(d){
  if(!d||d.version===3)return d;
  const ws=d.settings?.werkstatt||d.werkstatt||'Atemschutzwerkstatt';
  const slug=s=>'ort-'+String(s).toLowerCase().replace(/[^a-z0-9äöüß]+/g,'-');
  const oid=n=>n===ws?WS:slug(n);
  const orte=(d.standorte||[]).filter(n=>n!==ws).map((n,i)=>({id:slug(n),name:n,bnr:'',art:/lager|pool/i.test(n)?'lager':'fahrzeug',status:'Einsatzbereit auf Wache',pos:i+1,u:0}));
  const geraete=[],buchungen=[];
  for(const g of d.geraete||[]){
    if(g.typ==='PA')geraete.push({id:g.id,kat:'PA',bez:'',nr:g.nr,faellig:(g.pruefung||'').slice(0,7),ort:oid(g.standort),status:g.status,notiz:g.notiz||'',u:g.u||0,historie:g.historie||[]});
    else if(g.typ==='Maske'&&g.status!=='ausgesondert')buchungen.push({id:'mig-'+g.id,u:0,d:isoDT(),von:'',ort:oid(g.standort),kat:g.groesse==='S'?'MS':'MM',faellig:(g.pruefung||'').slice(0,7),n:1,grund:'Übernahme',ref:''})}
  const conv=l=>(l||[]).map(x=>({kat:x.typ==='PA'?'PA':x.typ==='Maske'?'MM':'SON',text:x.nr,n:1}));
  return{version:3,sharedU:d.sharedU||0,feuerwehr:d.feuerwehr??d.settings?.feuerwehr??'',vorlauf:d.vorlauf??d.settings?.vorlauf??30,orte,geraete,buchungen,
    vorgaenge:(d.vorgaenge||[]).map(v=>({id:v.id,u:v.u||0,von:v.von||'',datum:v.datum,anlass:v.anlass,einsatz:v.einsatz,ort:oid(v.standort),ortName:v.standort,quelle:WS,quelleName:ws,raus:conv(v.zurueck),rein:conv(v.ausgabe),bearbeiter:v.bearbeiter,uebernommen:v.uebernommen,bemerkung:v.bemerkung,sig:v.sig||''})),
    inventuren:(d.inventuren||[]).map(i=>({id:i.id,u:i.u||0,von:i.von||'',datum:i.datum,ort:oid(i.standort),ortName:i.standort,ok:conv(i.vorhanden),fehlt:conv(i.fehlend),extra:conv(i.zusaetzlich),mengen:[],status:'',bearbeiter:i.bearbeiter,bemerkung:i.bemerkung,sig:i.sig||''})),
    geloescht:d.geloescht||{}};
}
function fromAny(d,keepSettings){const m=migrate(d);const s=Object.assign(emptyState(),m);
  s.settings=Object.assign(emptyState().settings,keepSettings||{},d.settings&&d.version===3?d.settings:{});
  if(d.version!==3&&d.settings){s.settings.bearbeiter=d.settings.bearbeiter||s.settings.bearbeiter}
  for(const k of['pending','lastSync'])if(d[k]!==undefined)s[k]=d[k];
  ensureOrte(s);return s}
function sampleState(){
  const s=emptyState();s.settings.beispiel=true;s.feuerwehr='Beispiel-Wache';
  s.orte.push({id:'bsp-lhf',name:'LHF',bnr:'1001',art:'fahrzeug',status:'Einsatzbereit auf Wache',pos:1,u:0},{id:'bsp-lf',name:'LF',bnr:'1002',art:'fahrzeug',status:'Nicht Einsatzbereit',pos:2,u:0});
  const mon=k=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+k);return`${d.getFullYear()}-${z(d.getMonth()+1)}`};
  const g=(kat,nr,ort,f,bez='')=>s.geraete.push({id:uid(),kat,bez,nr,faellig:f,ort,status:'bereit',notiz:'',u:0,historie:[{d:isoDT(),t:'Angelegt (Beispiel)',n:''}]});
  const b=(ort,kat,f,n)=>s.buchungen.push({id:uid(),u:0,d:isoDT(),von:'',ort,kat,faellig:f,n,grund:'Beispiel',ref:''});
  ['101','102','103','104'].forEach((n,i)=>g('PA',n,'bsp-lhf',mon(i?5+i:0)));['201','202'].forEach((n,i)=>g('PA',n,'bsp-lf',mon(3+i)));['301','302','303'].forEach(n=>g('PA',n,POOL,mon(8)));
  g('MGM','11','bsp-lhf',mon(2),'TITAN');g('CO','4711','bsp-lhf',mon(1),'');g('CO','4712','bsp-lf',mon(-1),'');
  b('bsp-lhf','FH',mon(2),2);b('bsp-lhf','FH',mon(14),2);b('bsp-lhf','MM',mon(0),1);b('bsp-lhf','MM',mon(4),1);b('bsp-lhf','MS',mon(6),1);b('bsp-lhf','FI',mon(30),7);
  b('bsp-lf','FH',mon(20),2);b('bsp-lf','FI',mon(30),4);
  b(POOL,'FH',mon(24),3);b(POOL,'MM',mon(3),4);b(POOL,'MM',mon(5),3);b(POOL,'MS',mon(4),2);b(POOL,'FI',mon(40),15);b(WS,'MM',mon(1),2);
  return s;
}
let S;
function load(){try{const raw=localStorage.getItem(KEY);const d=raw?JSON.parse(raw):null;
  S=!d?sampleState():(d.version!==3&&d.settings?.beispiel)?sampleState():fromAny(d)}catch(e){S=sampleState()}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Speichern fehlgeschlagen – Speicher voll oder blockiert.')}}

const byId=id=>S.geraete.find(g=>g.id===id);
const ortById=id=>S.orte.find(o=>o.id===id);
// Kennzeichen: gespeichert wird die Nummer (2128), angezeigt als B-2128
const kz=o=>!o?.bnr?'':/^[A-ZÄÖÜ]{1,3}-/i.test(o.bnr)?o.bnr:'B-'+o.bnr;
const ortName=id=>{const o=ortById(id);return o?o.name+(o.bnr?' '+kz(o):''):'(gelöscht)'};
const orteSorted=()=>[...S.orte].sort((a,b)=>(a.pos||0)-(b.pos||0)||a.name.localeCompare(b.name));
const fahrzeuge=()=>orteSorted().filter(o=>o.art==='fahrzeug');
const wache=()=>orteSorted().filter(o=>o.id!==WS);
const aktiv=()=>S.geraete.filter(g=>g.status!=='ausgesondert'&&g.status!=='abgegeben');
const sortG=(a,b)=>GK.indexOf(a.kat)-GK.indexOf(b.kat)||String(a.nr).localeCompare(String(b.nr),'de',{numeric:true});
const geraeteAn=ort=>aktiv().filter(g=>g.ort===ort).sort(sortG);
function bestand(ort){const m={};for(const b of S.buchungen)if(b.ort===ort){const k=b.kat+'|'+(b.faellig||'');m[k]=(m[k]||0)+b.n}
  return Object.entries(m).filter(([,n])=>n>0).map(([k,n])=>{const[kat,f]=k.split('|');return{kat,faellig:f,n,k}})
    .sort((a,b)=>MK.indexOf(a.kat)-MK.indexOf(b.kat)||(a.faellig||'9999').localeCompare(b.faellig||'9999'))}
function buch(ort,kat,faellig,n,grund,ref){if(!n)return;S.buchungen.push({id:uid(),u:Date.now(),d:isoDT(),von:me(),ort,kat,faellig:faellig||'',n,grund,ref:ref||''})}
function hist(g,t){(g.historie=g.historie||[]).unshift({d:isoDT(),t,n:me()});if(g.historie.length>80)g.historie.length=80;g.u=Date.now()}
const tomb=id=>{S.geloescht[id]=Date.now()};
const shared=()=>{S.sharedU=Date.now()};
const devText=g=>g.kat==='PA'?String(g.nr):[g.bez,g.nr?'Nr. '+g.nr:''].filter(Boolean).join(' ')||KAT1[g.kat];
const devLabel=g=>g.kat==='PA'?'PA '+g.nr:(g.bez||KAT1[g.kat])+(g.nr?' Nr. '+g.nr:'');
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function opts(list,sel){return list.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(l)}</option>`}).join('')}
const ortOpts=(sel,filter=()=>true)=>opts(orteSorted().filter(filter).map(o=>[o.id,ortName(o.id)]),sel);
const statusPill=s=>s==='bereit'?'':`<span class="pill ${STATUS[s].c}-p">${STATUS[s].l}</span>`;

const mtags=list=>`<div class="mline">${list.map(p=>`<span class="mtag ${dueCls(p.faellig)}">${fmtM(p.faellig)}${p.n>1?` ×${p.n}`:''}</span>`).join('')}</div>`;

function render(){
  // Wie bei der Kantine: Sobald Benutzer angelegt sind, ist ohne Anmeldung nur die Anmeldeseite zu sehen

  $('#tabs').hidden=view==='login';
  const tab={tauschNeu:'tausch',inventurNeu:'inventur',ort:'fahrzeuge'}[view]||view;

  for(const g of aktiv())if(g.ort!==WS&&g.faellig&&tageBis(g.faellig)<=S.vorlauf)r.push({f:g.faellig,html:devRow(g)});

  return r.sort((a,b)=>a.f.localeCompare(b.f))}

function devChips(list,sel,act,showOrt){if(!list.length)return'';
  return GK.map(k=>{const l=list.filter(g=>g.kat===k);if(!l.length)return'';
    return`<div class="group-l">${KAT[k]}</div><div class="chips">${l.map(g=>`<button type="button" class="chip ${sel.includes(g.id)?'on':''}" data-act="${act}" data-id="${g.id}" aria-pressed="${sel.includes(g.id)}">${esc(devText(g))}<span class="t ${sel.includes(g.id)?'':dueCls(g.faellig)}">${fmtM(g.faellig)}</span></button>`).join('')}</div>`}).join('')}
function stepRows(list,sel,side,maxFn){if(!list.length)return'';
  return MK.map(k=>{const l=list.filter(p=>p.kat===k);if(!l.length)return'';
    return`<div class="group-l">${KAT[k]}</div><div>${l.map(p=>{const v=sel[p.k]||0,max=maxFn?maxFn(p):p.n;return`<div class="step"><span class="grow"><b class="mono ${dueCls(p.faellig)}">${fmtM(p.faellig)}</b> <span class="hint">· ${p.n} vorhanden</span></span>
      <button class="sb" data-act="st" data-side="${side}" data-k="${p.k}" data-d="-1" ${v<=0?'disabled':''} aria-label="weniger">−</button><b class="mono sv ${v?'on':''}">${v}</b><button class="sb" data-act="st" data-side="${side}" data-k="${p.k}" data-d="1" ${v>=max?'disabled':''} aria-label="mehr">+</button></div>`}).join('')}</div>`}).join('')}
function updTausch(){
  const f=(q,g)=>!q||devText(g).toLowerCase().includes(q.toLowerCase());
  const g1=geraeteAn(T.ort).filter(g=>!T.rein.g.includes(g.id)&&(f(T.q1,g)||T.raus.g.includes(g.id)));
  const g2=geraeteAn(T.quelle).filter(g=>(g.status==='bereit'||T.rein.g.includes(g.id))&&(f(T.q2,g)||T.rein.g.includes(g.id)));
  const m1=bestand(T.ort),m2=bestand(T.quelle);
  $('#pick1').innerHTML=(devChips(g1,T.raus.g,'pick1')+stepRows(m1,T.raus.m,'raus'))||'<p class="hint">Auf diesem Fahrzeug ist laut Bestand nichts.</p>';
  $('#pick2').innerHTML=(devChips(g2,T.rein.g,'pick2')+stepRows(m2,T.rein.m,'rein'))||`<p class="hint">In ${esc(ortName(T.quelle))} ist nichts Einsatzbereites.</p>`;
  const n=s=>T[s].g.length+Object.values(T[s].m).reduce((a,b)=>a+b,0);
  $('#t-sum').innerHTML=`<span class="pill warn-p">${n('raus')} runter</span><span class="pill ok-p">${n('rein')} drauf</span>`;
  saveDraft();
}
let sigPad=null;
function setupSig(canvas,initial,onchange){
  const ctx=canvas.getContext('2d');let drawing=false,dirty=!!initial;
  const r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.scale(dpr,dpr);
  ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=getComputedStyle(document.body).color;
  if(initial){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=initial}
  const pos=e=>{const b=canvas.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))});
  canvas.addEventListener('pointermove',e=>{if(!drawing)return;ctx.lineTo(...pos(e));ctx.stroke();dirty=true});
  const exp=()=>{if(!dirty)return'';const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;const x=c.getContext('2d');x.drawImage(canvas,0,0);
    x.globalCompositeOperation='source-in';x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);return c.toDataURL('image/png')};
  const end=()=>{if(drawing){drawing=false;onchange(exp())}};
  canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
  return{clear(){ctx.clearRect(0,0,canvas.width,canvas.height);dirty=false;onchange('')}};
}
function initTausch(){updTausch();sigPad=setupSig($('#sig'),T.sig,d=>{T.sig=d;saveDraft()})}
function tauschSpeichern(){
  T.raus.g=T.raus.g.filter(byId);T.rein.g=T.rein.g.filter(byId);
  const m1=Object.entries(T.raus.m).filter(([,n])=>n>0),m2=Object.entries(T.rein.m).filter(([,n])=>n>0);
  if(!T.raus.g.length&&!T.rein.g.length&&!m1.length&&!m2.length){toast('Bitte mindestens ein Teil auswählen.');return}
  const id=uid(),txt=`${T.anlass}${T.einsatz?' '+T.einsatz:''}`,fz=ortName(T.ort);
  const items=(gl,ml)=>[...gl.map(i=>{const g=byId(i);return{kat:g.kat,text:devText(g),faellig:g.faellig,n:1}}),...ml.map(([k,n])=>{const[kat,f]=k.split('|');return{kat,text:fmtM(f),faellig:f,n}})];
  const v={id,u:Date.now(),von:me(),datum:T.datum,anlass:T.anlass,einsatz:T.einsatz,ort:T.ort,ortName:fz,quelle:T.quelle,quelleName:ortName(T.quelle),
    raus:items(T.raus.g,m1),rein:items(T.rein.g,m2),bearbeiter:T.bearbeiter,uebernommen:T.uebernommen,bemerkung:T.bemerkung,sig:T.sig,erstellt:isoDT()};
  T.raus.g.forEach(i=>{const g=byId(i);g.status='abgegeben';hist(g,`Runter von ${fz} (${txt}), an die Atemschutzwerkstatt abgegeben`);g.ort=WS});
  m1.forEach(([k,n])=>{const[kat,f]=k.split('|');buch(T.ort,kat,f,-n,'Tausch '+txt+' – abgegeben/verbraucht',id)});
  T.rein.g.forEach(i=>{const g=byId(i);hist(g,`Auf ${fz} (${txt}), vorher ${ortName(g.ort)}`);g.ort=T.ort});
  m2.forEach(([k,n])=>{const[kat,f]=k.split('|');buch(T.quelle,kat,f,-n,'Tausch '+txt+' an '+fz,id);buch(T.ort,kat,f,n,'Tausch '+txt,id)});
  S.vorgaenge.unshift(v);save();T=null;try{localStorage.removeItem(DRAFT)}catch(e){}
  toast('Tausch gespeichert');go('tausch');openVorgang(id);
}

function download(name,content,mime){
  const blob=content instanceof Blob?content:new Blob([content],{type:mime});
  const file=new File([blob],name,{type:mime});
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}

    const cols=[gs.filter(g=>g.kat==='PA'),...MK.map(k=>best.filter(p=>p.kat===k)),gs.filter(g=>g.kat==='CO'),gs.filter(g=>g.kat==='MGM'),gs.filter(g=>g.kat==='SON')];

  o.addEventListener('click',e=>{if(e.target===o)closeSheet()});document.body.appendChild(o);document.body.style.overflow='hidden'}
function closeSheet(){$('#ov')?.remove();document.body.style.overflow=''}
const head=t=>`<div class="sheet-h"><h3>${t}</h3><button class="x" data-act="close" aria-label="Schließen">×</button></div>`;

  const k=$('#g-kat'),upd=()=>{$('#g-bezl').hidden=k.value==='PA'||k.value==='CO';$('#g-fl').textContent=k.value==='PA'?'TÜV fällig':'Prüfung fällig'};upd();k.addEventListener('change',upd);
  $('#gform').addEventListener('submit',e=>{e.preventDefault();if(!canEdit())return needAuth();const err=t=>{const x=$('#g-err');x.hidden=false;x.textContent=t};

    <button class="btn primary" data-act="buchenOk" data-ort="${ort}" data-k="${k||''}">Buchen</button>
  </div>`);
  const m=$('#b-mode'),u=()=>{$('#b-zl').hidden=$('#b-nfl').hidden=m.value!=='um'};u();m.addEventListener('change',u);

function buchenOk(ort,k){
  const err=t=>{const x=$('#b-err');x.hidden=false;x.textContent=t};
  const kat=$('#b-kat').value,f=parseM($('#b-f').value),n=Math.floor(+$('#b-n').value),mode=$('#b-mode').value,grund=$('#b-grund').value.trim(),nf=parseM($('#b-nf').value),ziel=$('#b-ziel').value;
  if(f===null||nf===null)return err('Fälligkeit bitte als MM/JJ eingeben, z. B. 11/26.');
  if(!(n>0))return err('Bitte eine Anzahl größer 0 eingeben.');
  const vorh=bestand(ort).find(p=>p.k===kat+'|'+f)?.n||0;
  if(mode!=='zu'&&n>vorh)return err(`In ${ortName(ort)} sind nur ${vorh} ${KAT1[kat]} ${fmtM(f)} gebucht.`);
  if(mode==='zu')buch(ort,kat,f,n,grund||'Zugang');
  else if(mode==='ab')buch(ort,kat,f,-n,grund||'Abgang');
  else{buch(ort,kat,f,-n,(grund||'Umlagerung')+' → '+ortName(ziel));buch(ziel,kat,nf||f,n,(grund||'Umlagerung')+' von '+ortName(ort))}
  save();closeSheet();render();toast('Gebucht');
}

/* ================= Gemeinsame Daten über GitHub (verschlüsselt) ================= */
// Wie bei der Kantine: Jedes Gerät wird einmal mit Zugangsschlüssel + Atemschutz-Passwort eingerichtet.
// Die Daten liegen nur verschlüsselt (AES-256-GCM) im privaten Repository; der Datenschlüssel ist mit dem Passwort (PBKDF2) gesichert.
const CFG='atemschutz-logbuch-sync', ENCFILE='inventar.enc.json', PLAINFILES=['inventar.json','daten.json'];
function cfg(){try{return JSON.parse(localStorage.getItem(CFG))||{}}catch(e){return{}}}
function setCfg(c){try{localStorage.setItem(CFG,JSON.stringify(c))}catch(e){}}
const verbunden=()=>!!(cfg().token&&cfg().dek);
let syncing=false,syncTimer=null,syncInfo={s:'',t:''},DEK=null;
const tenc=new TextEncoder(),tdec=new TextDecoder();
const b64=buf=>{const a=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(String(s).replace(/\s/g,'')),c=>c.charCodeAt(0));
async function gz(b){return new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer())}
async function gunz(b){return new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}
async function seal(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes))}}
async function unseal(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)))}
async function kek(pw,salt){const base=await crypto.subtle.importKey('raw',tenc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
const importDek=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);
async function dek(){if(!DEK&&cfg().dek)DEK=await importDek(unb64(cfg().dek));return DEK}
async function sha(s){return b64(await crypto.subtle.digest('SHA-256',tenc.encode(s)))}
function syncSoon(){if(!verbunden())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(),2500);showSync()}
function showSync(){const b=$('#syncb');if(!b)return;b.hidden=!verbunden();if(b.hidden)return;
  let cls='ok',t='Synchron';
  if(syncing){cls='run pend';t='Synchronisiere …'}
  else if(syncInfo.s==='err'){cls='err';t='Sync-Fehler'}
  else if(!navigator.onLine){cls='pend';t=S.pending?'Offline · gespeichert':'Offline'}
  else if(S.pending){cls='pend';t='Nicht synchron'}
  b.className='syncb '+cls;b.querySelector('span').textContent=t;b.title=syncInfo.t||(S.lastSync?'Zuletzt synchronisiert '+fmtDT(S.lastSync):'')}
async function gh(path,o={},c=cfg()){
  return fetch('https://api.github.com/repos/'+c.repo+path,{method:o.method||'GET',cache:'no-store',
    headers:{'Authorization':'Bearer '+c.token,'Accept':o.accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(o.body?{'Content-Type':'application/json'}:{})},
    body:o.body?JSON.stringify(o.body):undefined})}
function ghFehler(r){return r.status===401?'Zugangsschlüssel ungültig oder abgelaufen.':r.status===403?'Keine Berechtigung. Hat der Schlüssel Lese- und Schreibrechte für das Repository?':r.status===404?'Repository nicht gefunden oder kein Zugriff.':'GitHub antwortet mit Fehler '+r.status+'.'}
const COLL=['orte','geraete','buchungen','vorgaenge','inventuren','users'];
function payload(d){const by=(a,b)=>a.id<b.id?-1:1;const p={version:3,sharedU:d.sharedU||0,feuerwehr:d.feuerwehr||'',vorlauf:d.vorlauf||30,geloescht:Object.fromEntries(Object.entries(d.geloescht||{}).sort())};
  for(const c of COLL)p[c]=[...(d[c]||[])].sort(by);return p}
function mergeList(a,b,tombs,isGeraet){const m=new Map();
  for(const x of [...a,...b]){const y=m.get(x.id);if(!y){m.set(x.id,x);continue}
    const win=(x.u||0)>(y.u||0)?x:y;
    if(isGeraet){const h=new Map();[...(x.historie||[]),...(y.historie||[])].forEach(e=>h.set(e.d+'|'+e.t,e));
      m.set(x.id,{...win,historie:[...h.values()].sort((p,q)=>p.d<q.d?1:-1).slice(0,80)})}else m.set(x.id,win)}
  return[...m.values()].filter(x=>!(tombs[x.id]&&tombs[x.id]>=(x.u||0)))}
function merge(L,R){if(!R)return L;const tombs={...R.geloescht};for(const[k,v]of Object.entries(L.geloescht))tombs[k]=Math.max(v,tombs[k]||0);
  const sh=(L.sharedU||0)>=(R.sharedU||0)?L:R;const o={sharedU:sh.sharedU,feuerwehr:sh.feuerwehr,vorlauf:sh.vorlauf,geloescht:tombs};
  for(const c of COLL)o[c]=mergeList(L[c]||[],R[c]||[],tombs,c==='geraete');ensureOrte(o);return payload(o)}
function apply(p){for(const c of COLL)S[c]=p[c];Object.assign(S,{sharedU:p.sharedU,feuerwehr:p.feuerwehr,vorlauf:p.vorlauf,geloescht:p.geloescht});
  S.vorgaenge.sort((a,b)=>a.datum<b.datum?1:-1);S.inventuren.sort((a,b)=>a.datum<b.datum?1:-1);S.buchungen.sort((a,b)=>a.d<b.d?-1:1)}
async function listRoot(c){const l=await gh('/contents/',{},c);if(l.status===404){const e=await gh('',{},c);if(!e.ok)throw new Error(ghFehler(e));return[]}
  if(!l.ok)throw new Error(ghFehler(l));return l.json()}
async function rawFile(name,c){const r=await gh('/contents/'+name,{accept:'application/vnd.github.raw+json'},c);if(!r.ok)throw new Error(ghFehler(r));return r.text()}
async function pull(){
  const list=await listRoot(),f=list.find(x=>x.name===ENCFILE),plain=list.filter(x=>PLAINFILES.includes(x.name));
  let data=null;
  if(f){const o=JSON.parse(await rawFile(ENCFILE));data=JSON.parse(tdec.decode(await gunz(await unseal(await dek(),o))))}
  else if(plain.length){data=migrate(JSON.parse(await rawFile((plain.find(x=>x.name==='inventar.json')||plain[0]).name)))}
  if(data){data=migrate(data);ensureOrte(data);data=payload(data)}
  return{sha:f?.sha||null,data,plain}}
const sigCache={};
async function uploadSigs(){for(const x of [...S.vorgaenge,...S.inventuren]){if(!x.sig||!x.sig.startsWith('data:'))continue;
  const path='unterschriften/'+x.id+'.enc.json',enc=await seal(await dek(),unb64(x.sig.split(',')[1]));
  const r=await gh('/contents/'+path,{method:'PUT',body:{message:'Unterschrift',content:b64(tenc.encode(JSON.stringify(enc)))}});
  if(r.ok||r.status===422){sigCache[x.id]=x.sig;x.sig=path}else throw new Error(ghFehler(r))}}
async function sigUrl(x){if(!x.sig)return'';if(x.sig.startsWith('data:'))return x.sig;if(sigCache[x.id])return sigCache[x.id];
  try{const r=await gh('/contents/'+x.sig,{accept:'application/vnd.github.raw+json'});if(!r.ok)return'';
    if(x.sig.endsWith('.png')){const bl=await r.blob();return sigCache[x.id]=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(bl)})}
    const o=JSON.parse(await r.text());return sigCache[x.id]='data:image/png;base64,'+b64(await unseal(await dek(),o))}catch(e){return''}}
async function sync(manual){
  if(!verbunden()||syncing)return;if(!navigator.onLine){showSync();if(manual)toast('Kein Netz – Änderungen bleiben auf dem Handy gespeichert.');return}
  syncing=true;showSync();
  try{let ok=false,rem;
    for(let i=0;i<4&&!ok;i++){
      await uploadSigs();
      rem=await pull();const merged=merge(payload(S),rem.data);apply(merged);saveLocal();
      const out=JSON.stringify(merged);
      if(rem.sha&&rem.data&&out===JSON.stringify(rem.data)){ok=true;break}
      const c=cfg(),file={app:'atemschutz',v:3,salt:c.salt,wrap:c.wrap,...(await seal(await dek(),await gz(tenc.encode(out))))};
      const r=await gh('/contents/'+ENCFILE,{method:'PUT',body:{message:`Aktualisierung von ${me()||'unbekannt'}`,content:b64(tenc.encode(JSON.stringify(file))),...(rem.sha?{sha:rem.sha}:{})}});
      if(r.ok)ok=true;else if(r.status!==409&&r.status!==422)throw new Error(ghFehler(r))}
    if(!ok)throw new Error('Daten wurden gleichzeitig geändert – bitte erneut versuchen.');
    // Unverschlüsselte Altdateien entfernen, sobald alles verschlüsselt gespeichert ist
    for(const p of rem.plain||[])await gh('/contents/'+p.name,{method:'DELETE',body:{message:'Unverschlüsselte Altdatei entfernt',sha:p.sha}});
    S.pending=false;S.lastSync=isoDT();saveLocal();syncInfo={s:'ok',t:''};if(manual)toast('Synchronisiert');
    const busy=$('#ov')||['tauschNeu','inventurNeu'].includes(view)||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
    if(!busy)render();

// Gerät einrichten: Zugangsschlüssel + Atemschutz-Passwort
async function verbinden(){
  const repo=$('#s-repo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,''),token=$('#s-token').value.trim(),pw=$('#s-pw').value,pw2=$('#s-pw2')?.value;
  const msg=t=>{const e=$('#sync-msg');e.hidden=false;e.textContent=t};
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token){msg('Bitte Repository und Zugangsschlüssel eintragen.');return}
  if(!pw){msg('Bitte das Atemschutz-Passwort eintragen.');return}
  const c={repo,token};msg('Verbinde …');
  try{const list=await listRoot(c),f=list.find(x=>x.name===ENCFILE);let raw,hdr;
    if(f){const o=JSON.parse(await rawFile(ENCFILE,c));
      try{raw=await unseal(await kek(pw,unb64(o.salt)),o.wrap)}catch(e){throw new Error('Das Atemschutz-Passwort ist falsch.')}
      hdr={salt:o.salt,wrap:o.wrap}}
    else{
      if(!$('#s-pw2')){ui.neuAnlegen=true;render();setTimeout(()=>{const e=$('#sync-msg');e.hidden=false;e.textContent='Im Repository gibt es noch keine verschlüsselten Daten. Lege jetzt das Atemschutz-Passwort fest (mindestens 10 Zeichen) und wiederhole es.'},0);return}
      if(pw.length<10)throw new Error('Das Passwort muss mindestens 10 Zeichen haben.');
      if(pw!==pw2)throw new Error('Die beiden Passwörter stimmen nicht überein.');
      raw=crypto.getRandomValues(new Uint8Array(32));const salt=crypto.getRandomValues(new Uint8Array(16));
      hdr={salt:b64(salt),wrap:await seal(await kek(pw,salt),raw)}}
    setCfg({repo,token,dek:b64(raw),salt:hdr.salt,wrap:hdr.wrap});DEK=null;ui.neuAnlegen=false;
    if(S.settings.beispiel){S=emptyState()}
    S.pending=true;saveLocal();await sync(true);if(syncInfo.s==='err')throw new Error(syncInfo.t);ui.nachLogin='start';go(needLogin()?'login':'start')}
  catch(e){setCfg({repo});DEK=null;msg(e.message);showSync()}
}
